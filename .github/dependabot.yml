# Dependabot (PRD 9.4 rule 15, Appendix A #37 and #38).
# Security updates arrive as soon as an advisory is published (switch on
# "Dependabot security updates" in the repository settings). Version updates
# arrive monthly. Edge Function dependencies live in deno.json, which
# Dependabot cannot read; scripts/function-deps.mjs keeps them in step.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # Expo packages must move together, in versions Expo has tested for
      # the SDK. Major (SDK) upgrades are done by hand with `npx expo install --fix`.
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*', '@expo-google-fonts/*', 'react', 'react-native', 'react-native-*', 'eslint-config-expo']
      everything-else:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
